name: Publish wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/wiki/**"
      - ".github/workflows/publish-wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish docs/wiki to the GitHub wiki
        uses: Andrew-Chen-Wang/github-wiki-action@v4
        continue-on-error: true
        with:
          path: docs/wiki/
